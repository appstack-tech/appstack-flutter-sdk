name: API change gate

# A change to the committed public API baseline means the plugin's Dart API
# changed, and every app that integrates the plugin compiles against it.
# Require the author to say so with a label. test.yml's public-api job keeps the
# baseline honest; this keeps it visible.
#
# Separate from test.yml because it must re-run when labels change, and label
# events shouldn't re-run (or cancel) analyze, unit tests or the API extraction.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: api-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only: the diff goes to the job summary instead of a PR comment, which
# would need pull-requests: write.
permissions:
  contents: read

jobs:
  api-label:
    name: API change label
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # The PR merge commit plus its first parent (the base tip) is enough
          # to diff the PR's net change.
          fetch-depth: 2
          persist-credentials: false

      - name: Require label when the API baseline changes
        env:
          API_FILE: appstack_plugin/api/appstack_plugin.api.json
          # Passed through env, never interpolated into the script.
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- "$API_FILE"; then
            echo "$API_FILE unchanged."
            exit 0
          fi

          {
            echo "## Public API changed"
            echo
            echo "This PR changes \`$API_FILE\`. The breaking / non-breaking classification is in the summary of the Test workflow's *Public API baseline (Dart)* job."
            echo
            echo '```diff'
            git diff HEAD^1 HEAD -- "$API_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "$LABELS" | jq -e 'any(.[]; . == "breaking" or . == "api-change")' > /dev/null; then
            echo "Public API change acknowledged by label. Diff is in the job summary."
            exit 0
          fi

          echo "::error file=$API_FILE::This PR changes the plugin's public Dart API. Add the 'api-change' label (additive change) or 'breaking' (removed/renamed/changed signature) to acknowledge it. See appstack_plugin/PUBLIC_API.md."
          exit 1
