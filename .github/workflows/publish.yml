name: Publish to pub.dev

on:
  # A stable release is a merge to main whose appstack_plugin/CHANGELOG.md has a
  # new dated "## [X.Y.Z] - YYYY-MM-DD" section (see
  # .github/scripts/resolve-release-version.sh). Merges that don't add one
  # publish nothing. Day-to-day work lands on develop; the reviewed
  # develop -> main PR is the release approval. The workflow creates the X.Y.Z
  # tag itself, so pushing a tag by hand no longer publishes.
  #
  # Release candidates are triggered manually with workflow_dispatch on develop
  # and never mint a git tag: the pub.dev version is the identity. pub.dev
  # versions can't be deleted, so RCs come only from the protected develop.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release candidate version to publish, e.g. 3.0.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

# Single source of truth for version validation, reused by every job below so
# the publish gate and the release defense-in-depth check stay identical.
# Restricted SemVer: MAJOR.MINOR.PATCH with an optional, well-formed prerelease
# (dot-separated, non-empty [0-9A-Za-z-] identifiers — rejects empty identifiers
# and consecutive dots).
env:
  SEMVER_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
  # Keep in sync with test.yml and integration.yml.
  FLUTTER_VERSION: '3.44.1'

jobs:
  # Decides what this run publishes, before any build: the stable version from
  # the changelog on a push to main, or the validated RC input on a dispatch.
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Tags are needed to tell a new version from one already released.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and channel
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" != "develop" ]]; then
              echo "::error::Release candidates are published from develop, not '$REF_NAME'."
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            # Canonical RC form is X.Y.Z-rc.N; accept the legacy -rcN too.
            #
            # Match the whole string, not line by line: `grep -q` would accept a
            # newline-bearing input like "2.11.0-rc.1\nother=1" on its first line,
            # and that value is later echoed into $GITHUB_OUTPUT. [.] keeps the
            # dots literal regardless of how the shell processes backslashes.
            if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+-rc[.]?[0-9]+$ ]]; then
              echo "::error::Dispatch version '$VERSION' is not a release candidate (expected e.g. 3.0.0-rc.1)."
              exit 1
            fi
            {
              echo "version=$VERSION"
              echo "channel=rc"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
          else
            .github/scripts/resolve-release-version.sh appstack_plugin/CHANGELOG.md
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

  # Cheap release gate, first: confirm the vendored XCFramework is the artifact
  # the SwiftPM pin resolves to (2.4.0 shipped an rc0 XCFramework against a
  # 4.4.0 pin and every other check stayed green), and, for a stable release,
  # that every version copy agrees and both native pins are released versions.
  # Runs before the simulator/emulator matrix and before any GCP auth, so a
  # problem cancels the release in about a minute.
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ needs.resolve.outputs.release == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Check vendored XCFramework matches the pinned SDK version
        run: bash appstack_plugin/tool/check_ios_sdk_parity.sh

      - name: Check native pins are released
        if: ${{ needs.resolve.outputs.channel == 'stable' }}
        run: bash appstack_plugin/tool/check_release_pins.sh

      - name: Setup Flutter SDK
        if: ${{ needs.resolve.outputs.channel == 'stable' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Check version copies agree
        if: ${{ needs.resolve.outputs.channel == 'stable' }}
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: dart run tool/set_version.dart --check "$VERSION"
        working-directory: appstack_plugin

  # Publishing is allowed only after the same build/link and hermetic runtime
  # checks that gate pull requests have passed for this commit.
  integration:
    name: Build and runtime checks
    needs: verify
    uses: ./.github/workflows/integration.yml

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [resolve, integration]
    # Serialize publishes so two candidates cannot run their GCP auth and publish
    # steps at the same time. Queue rather than cancel.
    concurrency:
      group: publish-pub
      cancel-in-progress: false
    # GCP_SA_KEY lives in this environment, which only main (stable) and
    # develop (RCs) can deploy to.
    environment: release
    # Least privilege: publishing only reads the repo. Creating the GitHub
    # Release (which needs contents: write) is isolated in the `release` job.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Re-runs after a failed GitHub Release step must not try to publish the
      # same version again; pub.dev rejects that outright.
      - name: Check whether this version is already on pub.dev
        id: existing
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if curl -fsS -o /dev/null "https://pub.dev/api/packages/appstack_plugin/versions/$VERSION"; then
            echo "::notice::$VERSION is already on pub.dev; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: ${{ steps.existing.outputs.published == 'false' }}
        run: flutter pub get
        working-directory: appstack_plugin

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        if: ${{ steps.existing.outputs.published == 'false' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up pub.dev credentials
        if: ${{ steps.existing.outputs.published == 'false' }}
        run: |
          gcloud auth print-identity-token --audiences=https://pub.dev | flutter pub token add https://pub.dev

      # Dry-run BEFORE any RC stamping: `pub publish --dry-run` fails on
      # warnings and flags a dirty git tree as one, so it must run while the
      # checkout is still clean. The real publish below uses `-f` to force past
      # an RC's version-file edits.
      - name: Publish - dry run
        if: ${{ steps.existing.outputs.published == 'false' }}
        run: flutter pub publish --dry-run
        working-directory: appstack_plugin

      # A stable release ships the reviewed commit as is: every version copy must
      # already agree (release-pr.yml checked it before the merge, verify on this
      # exact commit). An RC's version is a dispatch input, so it is stamped here.
      # See tool/set_version.dart.
      - name: Check or stamp version
        if: ${{ steps.existing.outputs.published == 'false' }}
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "rc" ]]; then
            dart run tool/set_version.dart "$VERSION" --no-changelog
          else
            dart run tool/set_version.dart --check "$VERSION"
          fi
        working-directory: appstack_plugin

      - name: Publish to pub.dev
        if: ${{ steps.existing.outputs.published == 'false' }}
        run: flutter pub publish -f
        working-directory: appstack_plugin

  # Create the X.Y.Z tag and a GitHub Release so the changes for each version
  # are visible on the repo's Releases page and users can see the current latest
  # version. Notes are pulled from the matching CHANGELOG section. Runs only
  # after the publish job succeeds (needs: publish), and is the only job granted
  # contents: write. Tags created with GITHUB_TOKEN don't trigger workflows, so
  # this can't start another run.
  #
  # Skipped for release candidates (channel == rc): those still publish to
  # pub.dev but do not get a GitHub Release.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.channel == 'stable' }}
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consume the version as an env value, not inline interpolation.
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Defense in depth: publish already validated this with the same
          # SEMVER_REGEX, but re-check before it flows into git/gh commands.
          # Stable-only is enforced by the job `if:` above, not this regex.
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_REGEX"; then
            echo "::error::Refusing to release invalid version '$VERSION'"
            exit 1
          fi

          # Idempotent: skip if a release for this version already exists (e.g. a
          # workflow re-run) instead of failing on `gh release create`.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            exit 0
          fi

          # Extract this version's section from the CHANGELOG: everything between
          # "## [VERSION]" and the next "## [" header.
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' appstack_plugin/CHANGELOG.md)

          # Trim leading/trailing blank lines (portable — no tac).
          NOTES=$(printf '%s\n' "$NOTES" \
            | sed '/./,$!d' \
            | awk 'NF{last=NR} {line[NR]=$0} END{for (i=1; i<=last; i++) print line[i]}')

          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION. See appstack_plugin/CHANGELOG.md for details."
          fi

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release_notes.md"
          echo "----- release notes for $VERSION -----"
          cat "$RUNNER_TEMP/release_notes.md"

          # Only stable versions reach this job (see the job's `if:`), so the
          # release is always marked latest. --target creates the tag on the
          # merge commit that was just published.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --target "$TARGET_SHA" \
            --latest
